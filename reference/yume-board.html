<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆめ掲示板（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEEBF5;
  --surface: #F8F6FC;
  --ink: #231B3A;
  --muted: #645C7E;
  --line: #D2CBE3;
  --field-line: #8A82A6;
  --moon: #B87700;
  --btn-bg: #231B3A;
  --btn-ink: #F8F6FC;
  --focus: #4B3FA8;
  --danger: #A82B47;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15122A;
    --surface: #1E1A38;
    --ink: #ECE8F8;
    --muted: #A29BBF;
    --line: #2E2950;
    --field-line: #6D6690;
    --moon: #F2C14E;
    --btn-bg: #ECE8F8;
    --btn-ink: #15122A;
    --focus: #B4A9FF;
    --danger: #FF8FA6;
  }
}
:root[data-theme="dark"] {
  --bg: #15122A;
  --surface: #1E1A38;
  --ink: #ECE8F8;
  --muted: #A29BBF;
  --line: #2E2950;
  --field-line: #6D6690;
  --moon: #F2C14E;
  --btn-bg: #ECE8F8;
  --btn-ink: #15122A;
  --focus: #B4A9FF;
  --danger: #FF8FA6;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.1rem 4rem; }

/* header */
.top {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
  padding: 2rem 0 1.4rem; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .8rem; }
.brand svg { flex: none; width: 2.6rem; height: 2.6rem; color: var(--moon); }
.brand svg path { fill: currentColor; }
h1 {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.15; margin: 0; letter-spacing: .06em;
}
.tagline { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }
.auth { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; padding-top: .3rem; }
.who { font-size: .9rem; font-weight: 700; word-break: break-all; }

/* buttons */
button { font-family: inherit; }
.btn {
  font: inherit; font-weight: 700; font-size: .95rem; line-height: 1.2;
  padding: .7rem 1.2rem; min-height: 2.75rem;
  border-radius: .4rem; border: 1.5px solid var(--ink); cursor: pointer;
  background: transparent; color: var(--ink);
}
.btn.primary { background: var(--btn-bg); color: var(--btn-ink); }
.btn.small { padding: .45rem .85rem; min-height: 2.25rem; font-size: .85rem; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

/* compose */
.compose { padding: 1.4rem 0 0; }
.compose-form {
  margin-top: 1rem; padding: 1.25rem; background: var(--surface);
  border: 1px solid var(--line); border-radius: .5rem;
}
.field { margin-bottom: 1.1rem; }
.field label { display: block; font-weight: 700; font-size: .92rem; margin-bottom: .3rem; }
.field .hint { font-weight: 400; color: var(--muted); font-size: .82rem; }
.field input[type="text"], .field textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--field-line); border-radius: .3rem; padding: .6rem .75rem;
}
.field textarea { min-height: 10rem; resize: vertical; line-height: 1.75; }
.field [aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: .85rem; margin: .3rem 0 0; min-height: 0; }
.count-line { display: flex; justify-content: space-between; gap: 1rem; }
.counter { color: var(--muted); font-size: .8rem; margin: .3rem 0 0; white-space: nowrap; }
.posting-as { margin: 0 0 1.1rem; font-size: .92rem; }
.form-actions { display: flex; gap: .7rem; flex-wrap: wrap; }

/* controls */
.controls { padding: 1.6rem 0 .4rem; display: flex; flex-direction: column; gap: .8rem; }
.seg { display: flex; gap: 1.4rem; border-bottom: 1px solid var(--line); }
.seg button {
  background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  padding: .5rem .1rem; font: inherit; font-weight: 700; font-size: 1.02rem;
  color: var(--muted); cursor: pointer; min-height: 2.75rem;
}
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--moon); }
.periods { display: flex; gap: .5rem; flex-wrap: wrap; }
.periods button {
  font: inherit; font-size: .88rem; padding: .35rem .95rem; min-height: 2.25rem;
  border: 1.5px solid var(--field-line); border-radius: 2rem; background: transparent;
  color: var(--ink); cursor: pointer;
}
.periods button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); }

/* posts */
.posts { list-style: none; margin: 0; padding: 0; }
.post {
  display: grid; grid-template-columns: 3rem 1fr; column-gap: 1rem;
  padding: 1.3rem 0; border-bottom: 1px solid var(--line);
}
.post.ranked { grid-template-columns: 2.3rem 3rem 1fr; column-gap: .7rem; }
.rank {
  font-family: var(--serif); font-weight: 700; font-size: 1.7rem; line-height: 1.3;
  text-align: center; color: var(--muted);
}
.rank.top { color: var(--ink); }
.like {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: .05rem;
  background: none; border: 0; border-radius: .4rem; padding: .35rem 0;
  min-width: 3rem; min-height: 3.5rem; cursor: pointer; color: var(--muted); font-size: .85rem; line-height: 1.3;
}
.like svg { width: 1.6rem; height: 1.6rem; }
.like svg path { fill: none; }
.like[aria-pressed="true"] { color: var(--moon); }
.like[aria-pressed="true"] svg path { fill: currentColor; }
.like[aria-pressed="true"] .num { color: var(--ink); font-weight: 700; }
.post-main { min-width: 0; }
.post h2 {
  font-family: var(--serif); font-weight: 700; font-size: 1.2rem; line-height: 1.5;
  margin: 0; overflow-wrap: anywhere;
}
.meta { display: flex; flex-wrap: wrap; gap: 0 .9rem; margin-top: .15rem; font-size: .82rem; color: var(--muted); }
.meta .name { color: var(--ink); font-weight: 700; }
.body {
  margin: .6rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
  line-height: 1.9; max-width: 38rem;
}
.body.clamped {
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.actions { margin-top: .35rem; display: flex; flex-wrap: wrap; gap: 0 1.1rem; }
.linkbtn {
  background: none; border: 0; padding: .5rem 0; font: inherit; font-size: .85rem;
  color: var(--muted); text-decoration: underline; text-underline-offset: .2em; cursor: pointer;
}
.linkbtn.warn { color: var(--danger); }

.empty { padding: 2.5rem 0; color: var(--muted); }
.empty p { margin: 0 0 1rem; }

footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; }
footer p { margin: 0 0 .8rem; max-width: 36rem; }

/* dialog + toast */
dialog {
  border: 1px solid var(--line); border-radius: .6rem; background: var(--surface); color: var(--ink);
  padding: 0; width: calc(100% - 2rem); max-width: 22rem;
}
dialog::backdrop { background: rgba(20, 15, 40, .6); }
.dlg-in { padding: 1.4rem; }
.dlg-in h3 { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 .3rem; }
.dlg-in p { margin: 0 0 1rem; color: var(--muted); font-size: .88rem; }
.toast-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); pointer-events: none; z-index: 20;
}
.toast {
  background: var(--btn-bg); color: var(--btn-ink); padding: .65rem 1.1rem; border-radius: .4rem;
  font-size: .92rem; font-weight: 500; max-width: 26rem; text-align: center;
  opacity: 0; transition: opacity .2s;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
/* names + avatars */
.namebtn {
  background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--ink);
  text-decoration: underline; text-decoration-style: dotted; text-underline-offset: .22em;
  cursor: pointer; text-align: left;
}
.avatar {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 2.4rem; height: 2.4rem; border-radius: 50%; color: #fff; font-weight: 700;
  font-size: 1rem; line-height: 1; user-select: none;
}
.avatar.sm { width: 1.8rem; height: 1.8rem; font-size: .8rem; }
.avatar.lg { width: 4.2rem; height: 4.2rem; font-size: 1.7rem; font-family: var(--serif); }
.meta { align-items: center; }
.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* profile page */
.profile { padding: 1.4rem 0 0; border-bottom: 1px solid var(--line); }
.profile-head { display: flex; align-items: center; gap: 1rem; margin-top: .5rem; padding-bottom: 1.3rem; }
.profile h2 { font-family: var(--serif); font-size: 1.7rem; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
.profile h2:focus { outline: none; }
.stats { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 0 1rem; }
.self-note { margin: .1rem 0 0; font-size: .85rem; color: var(--muted); }

/* comment button on posts */
.actions { align-items: center; }
.cbtn {
  display: inline-flex; align-items: center; gap: .4rem; background: none; border: 0;
  padding: .4rem .1rem; min-height: 2.25rem; font: inherit; font-size: .9rem; color: var(--ink); cursor: pointer;
}
.cbtn svg { width: 1.35rem; height: 1.35rem; }
.cbtn svg path { fill: none; }

/* comment popup (bottom sheet on phones) */
body.lock { overflow: hidden; }
dialog.sheet { max-width: 36rem; width: calc(100% - 2rem); max-height: min(86vh, 46rem); overflow: hidden; }
dialog.sheet[open] { display: flex; flex-direction: column; }
.sheet-head {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: .8rem;
  padding: .5rem .6rem .5rem 1.1rem; border-bottom: 1px solid var(--line);
}
.sheet-head h3 { font-family: var(--serif); font-size: 1.15rem; margin: 0; }
.sheet-head h3:focus { outline: none; }
.iconbtn {
  background: none; border: 0; color: var(--ink); width: 2.75rem; height: 2.75rem; border-radius: 50%;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.sheet-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
}
.sheet-ctx { margin: 0 0 .9rem; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.csort { display: flex; gap: .5rem; margin-bottom: 1.1rem; }
.csort button {
  font: inherit; font-size: .85rem; padding: .3rem .9rem; min-height: 2.25rem;
  border: 1.5px solid var(--field-line); border-radius: 2rem; background: transparent;
  color: var(--ink); cursor: pointer;
}
.csort button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); }
.cform { display: flex; gap: .8rem; align-items: flex-start; margin-bottom: 1rem; }
.cform-main { flex: 1; min-width: 0; }
.cform textarea {
  width: 100%; font: inherit; font-size: 1rem; line-height: 1.6; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--field-line); border-radius: .3rem; padding: .5rem .7rem; min-height: 3.2rem; resize: vertical;
}
.cform-foot { display: flex; justify-content: space-between; align-items: center; gap: .7rem; margin-top: .45rem; flex-wrap: wrap; }
.cform-foot .hint { font-size: .8rem; color: var(--muted); margin: 0; }
.rform { margin: .5rem 0 .3rem; }
.rform .cform-foot { justify-content: flex-end; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.clist, .replies { list-style: none; margin: 0; padding: 0; }
.cm { display: flex; gap: .8rem; padding: .75rem 0; }
.cm-main { flex: 1; min-width: 0; }
.cm-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .7rem; font-size: .82rem; color: var(--muted); }
.cm-meta .cname { color: var(--ink); font-weight: 700; }
.cm-text { margin: .15rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; }
.cm-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 0 1rem; margin-top: .1rem; }
.clike {
  display: inline-flex; align-items: center; gap: .35rem; background: none; border: 0; color: var(--muted);
  font: inherit; font-size: .85rem; padding: .4rem .5rem .4rem 0; min-height: 2.25rem; cursor: pointer;
}
.clike svg { width: 1.15rem; height: 1.15rem; }
.clike svg path { fill: none; }
.clike[aria-pressed="true"] { color: var(--moon); }
.clike[aria-pressed="true"] svg path { fill: currentColor; }
.clike[aria-pressed="true"] .num { color: var(--ink); font-weight: 700; }
.reply-toggle {
  display: inline-flex; align-items: center; background: none; border: 0; color: var(--focus);
  font: inherit; font-weight: 700; font-size: .88rem; padding: .4rem 0; min-height: 2.25rem; cursor: pointer;
}
.empty-c { color: var(--muted); padding: 1.2rem 0; margin: 0; }
@media (max-width: 40rem) {
  dialog.sheet {
    width: 100%; max-width: 100%; margin: auto 0 0 0; max-height: 88vh;
    border-radius: 1rem 1rem 0 0; border-bottom: 0;
  }
}
@supports (height: 1dvh) {
  @media (max-width: 40rem) { dialog.sheet { max-height: 88dvh; } }
}

[hidden] { display: none !important; }

@media (max-width: 30rem) {
  .top { flex-direction: column; gap: .9rem; }
  .auth { justify-content: flex-start; padding-top: 0; }
  .post { column-gap: .7rem; }
  .post.ranked { grid-template-columns: 1.9rem 2.8rem 1fr; column-gap: .5rem; }
  .rank { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <h1>ゆめ掲示板</h1>
      </div>
      <p class="tagline">見た夢を、そのまま置いていく場所。</p>
    </div>
    <div class="auth" id="auth"></div>
  </header>

  <section class="compose" id="compose" aria-label="夢を投稿する">
    <button type="button" class="btn primary" id="toggleForm" aria-expanded="false" aria-controls="postForm">夢を書く</button>
    <form class="compose-form" id="postForm" hidden novalidate>
      <p class="posting-as" id="postingAs" hidden></p>
      <div class="field" id="nameField">
        <label for="fName">名前 <span class="hint">（空欄なら「名無しさん」）</span></label>
        <input type="text" id="fName" maxlength="20" autocomplete="off">
      </div>
      <div class="field">
        <label for="fTitle">タイトル</label>
        <input type="text" id="fTitle" maxlength="40" autocomplete="off" aria-describedby="titleErr">
        <p class="err" id="titleErr" role="alert"></p>
      </div>
      <div class="field">
        <label for="fBody">夢の内容 <span class="hint">（実名・住所など、個人が特定できる情報は書かないでください）</span></label>
        <textarea id="fBody" maxlength="2000" aria-describedby="bodyErr"></textarea>
        <div class="count-line">
          <p class="err" id="bodyErr" role="alert"></p>
          <p class="counter" id="counter">0 / 2000</p>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">投稿する</button>
        <button type="button" class="btn" id="cancelForm">キャンセル</button>
      </div>
    </form>
  </section>

  <section class="profile" id="profile" hidden aria-label="ユーザーのページ"></section>

  <section class="controls" aria-label="表示の切り替え" id="listTop">
    <div class="seg" role="group" aria-label="並び順">
      <button type="button" id="modeNew" aria-pressed="true">新着</button>
      <button type="button" id="modeRank" aria-pressed="false">ランキング</button>
    </div>
    <div class="periods" role="group" aria-label="ランキングの期間" id="periods" hidden>
      <button type="button" data-period="day" aria-pressed="true">日間</button>
      <button type="button" data-period="week" aria-pressed="false">週間</button>
      <button type="button" data-period="all" aria-pressed="false">全期間</button>
    </div>
  </section>

  <main>
    <ol class="posts" id="posts"></ol>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer>
    <p>これは試作版です。投稿やいいねはこのブラウザにだけ保存され、他の人には見えません。</p>
    <p>夢の内容には、怖い描写や生々しい描写が含まれることがあります。見たくない投稿は「通報」で非表示にできます。</p>
    <button type="button" class="linkbtn" id="resetDemo">サンプルデータに戻す</button>
  </footer>
</div>

<dialog id="loginDlg" aria-labelledby="loginTitle">
  <div class="dlg-in">
    <h3 id="loginTitle">ログイン</h3>
    <p>試作版なので、パスワードなしで名前だけ決めて使えます。</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="lName">ユーザー名</label>
        <input type="text" id="lName" maxlength="20" autocomplete="off" aria-describedby="lErr">
        <p class="err" id="lErr" role="alert"></p>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">ログインする</button>
        <button type="button" class="btn" id="loginCancel">キャンセル</button>
      </div>
    </form>
  </div>
</dialog>

<dialog id="cDlg" class="sheet" aria-labelledby="cTitle">
  <div class="sheet-head">
    <h3 id="cTitle" tabindex="-1">コメント</h3>
    <button type="button" class="iconbtn" id="cClose" aria-label="閉じる">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="cBody">
    <p class="sheet-ctx" id="cCtx"></p>
    <div class="csort" role="group" aria-label="コメントの並び順">
      <button type="button" data-sort="top" aria-pressed="true">人気順</button>
      <button type="button" data-sort="new" aria-pressed="false">新しい順</button>
    </div>
    <form class="cform" id="cForm" novalidate>
      <span id="cAvatar"></span>
      <div class="cform-main">
        <label for="cInput" class="sr">コメントを追加</label>
        <textarea id="cInput" maxlength="500" rows="2" placeholder="コメントを追加…"></textarea>
        <div class="cform-foot">
          <p class="hint" id="cHint"></p>
          <button type="submit" class="btn primary small" id="cSubmit" disabled>コメントする</button>
        </div>
      </div>
    </form>
    <ul class="clist" id="cList"></ul>
    <p class="empty-c" id="cEmpty" hidden>まだコメントがありません。最初のコメントを書いてみましょう。</p>
  </div>
</dialog>

<div class="toast-wrap"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var HOUR = 3600000, DAY = 86400000;
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  var BUBBLE = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  var PALETTE = ['#5B4FC4', '#2F7D6B', '#B5482F', '#8A3F8F', '#2C6FA8', '#8C6A12'];

  /* ---------- state ---------- */
  var uid = store.get('yume_uid', null);

  if (!Array.isArray(posts)) {
    // carry over posts written in the first prototype, then add the new sample data
    var old = store.get('yume_posts_v1', null);
    var mine = Array.isArray(old) ? old.filter(function (p) { return p.uid === uid && !/^s\d+$/.test(p.id); }) : [];

  /* ---------- rendering: board ---------- */
  function visiblePosts() {

      list.sort(function (a, b) { return b.ts - a.ts; });
    } else if (view.mode === 'new') {
      list.sort(function (a, b) { return b.ts - a.ts; });
    } else {
      var win = view.period === 'day' ? DAY : view.period === 'week' ? 7 * DAY : Infinity;
      var now = Date.now();
      list = list.filter(function (p) { return now - p.ts <= win; });
      list.sort(function (a, b) { return (b.likes - a.likes) || (b.ts - a.ts); });
    }
    return list;

  /* ---------- post actions ---------- */
  function toggleLike(id) {
    var p = getPost(id);
    if (!p) return;
    if (liked.has(id)) { liked.delete(id); p.likes = Math.max(0, p.likes - 1); }
    else { liked.add(id); p.likes += 1; }
    savePosts(); saveLiked();
    renderList();
    if (view.mode === 'profile') renderProfile();
    focusFk('like:' + id);
  }

  function deletePost(id) {
    if (pendingDelete !== id) {
      pendingDelete = id;
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(function () { pendingDelete = null; renderList(); }, 4000);
      renderList(); focusFk('del:' + id);
      return;
    }
    clearTimeout(pendingTimer);
    pendingDelete = null;
    posts = posts.filter(function (x) { return x.id !== id; });
    liked.delete(id);
    savePosts(); saveLiked();
    renderChrome(); renderList();
    toast('削除しました');
  }

  function reportPost(id) {

    if (typeof cDlg.close === 'function') cDlg.close(); else { cDlg.removeAttribute('open'); onCommentsClosed(); }
  }

  function onCommentsClosed() {
    document.body.classList.remove('lock');
    var id = cs.postId;
    var skip = cs.noFocus;
    cs.postId = null; cs.replyTo = null; cs.noFocus = false;
    clearTimeout(cs.pendTimer); cs.pendDel = null;
    if (!skip && id) focusFk('cm:' + id);
  }

  function syncCSubmit() { $('#cSubmit').disabled = !$('#cInput').value.trim(); }

  function commentEl(p, c, parentC) {
    var isReply = !!parentC;
    var root = parentC || c;

    var likeBtn = h('button', {
      type: 'button', class: 'clike', 'aria-pressed': String(cliked.has(c.id)), 'data-fk': 'cl:' + c.id,
      'aria-label': 'いいね（' + c.likes + '）',
      onclick: function () { toggleCLike(p.id, c.id); }
    });
    likeBtn.insertAdjacentHTML('beforeend', MOON);
    likeBtn.appendChild(h('span', { class: 'num', text: String(c.likes) }));

    var nameEl = c.user
      ? h('button', { type: 'button', class: 'namebtn cname', text: c.name, title: c.name + ' のページを開く', onclick: function () { openProfile(c.name); } })
      : h('span', { class: 'cname', text: c.name });

    var meta = h('div', { class: 'cm-meta' }, nameEl, c.user ? null : h('span', { text: 'ID:' + c.aid }), timeEl(c.ts));

    var actions = h('div', { class: 'cm-actions' },
      likeBtn,
      h('button', {
        type: 'button', class: 'linkbtn', text: '返信', 'data-fk': 'rp:' + c.id,
        onclick: function () { startReply(p.id, root.id, c.id, isReply ? c.name : null); }
      })
    );
    if (c.uid === uid) {
      actions.appendChild(h('button', {
        type: 'button', class: 'linkbtn warn', 'data-fk': 'cd:' + c.id,
        text: cs.pendDel === c.id ? 'もう一度押すと削除します' : '削除',
        onclick: function () { deleteComment(p.id, c.id); }
      }));
    }

    var main = h('div', { class: 'cm-main' }, meta, h('p', { class: 'cm-text', text: c.text }), actions);

    if (cs.replyTo && cs.replyTo.from === c.id) main.appendChild(replyForm(p, root, cs.replyTo.mention));

    if (!isReply && c.replies.length) {
      var isOpen = cs.open.has(c.id);
      main.appendChild(h('button', {
        type: 'button', class: 'reply-toggle', 'aria-expanded': String(isOpen), 'data-fk': 'rt:' + c.id,
        text: '返信 ' + c.replies.length + '件を' + (isOpen ? '非表示' : '表示'),
        onclick: function () {
          if (cs.open.has(c.id)) cs.open.delete(c.id); else cs.open.add(c.id);
          renderComments('rt:' + c.id);
        }
      }));
      if (isOpen) {
        var rl = h('ul', { class: 'replies' });
        c.replies.slice().sort(function (a, b) { return a.ts - b.ts; }).forEach(function (r) {
          rl.appendChild(commentEl(p, r, c));
        });
        main.appendChild(rl);
      }
    }

    return h('li', { class: 'cm' }, avatar(c.name, ukey(c), isReply ? 'sm' : null), main);
  }

  function replyForm(p, root, mention) {
    var prefix = mention ? '@' + mention + ' ' : '';
    var ta = h('textarea', { id: 'rInput', maxlength: '500', rows: '2', 'aria-label': '返信を追加', placeholder: '返信を追加…' });
    ta.value = prefix;
    var submit = h('button', { type: 'submit', class: 'btn primary small', text: '返信する', disabled: true });
    function meaningful() { var t = ta.value.trim(); return t && t !== prefix.trim(); }
    function sync() { submit.disabled = !meaningful(); }
    ta.addEventListener('input', sync);
    var from = cs.replyTo.from;
    return h('form', {
      class: 'cform rform', novalidate: true,
      onsubmit: function (e) {
        e.preventDefault();
        if (!meaningful()) return;
        addComment(p.id, root.id, ta.value.trim());
      }
    },
      avatar(curName(), curKey(), 'sm'),
      h('div', { class: 'cform-main' },
        ta,
        h('div', { class: 'cform-foot' },
          h('button', { type: 'button', class: 'btn small', text: 'キャンセル', onclick: function () { cs.replyTo = null; renderComments('rp:' + from); } }),
          submit
        )
      )
    );
  }

  function renderComments(fk) {
    var p = getPost(cs.postId);
    if (!p) return;
    $('#cTitle').textContent = 'コメント ' + countComments(p) + '件';
    $('#cCtx').textContent = '「' + p.title + '」';
    Array.prototype.forEach.call(document.querySelectorAll('.csort button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-sort') === cs.sort));
    });
    var av = $('#cAvatar');
    av.textContent = '';
    av.appendChild(avatar(curName(), curKey()));
    $('#cHint').textContent = user ? user.name + ' として投稿します' : '名無しさんとして投稿します（ログインすると名前が付きます）';

    var list = p.comments.slice();
    if (cs.sort === 'top') list.sort(function (a, b) { return (b.likes - a.likes) || (b.ts - a.ts); });
    else list.sort(function (a, b) { return b.ts - a.ts; });
    var ul = $('#cList');
    ul.textContent = '';
    list.forEach(function (c) { ul.appendChild(commentEl(p, c, null)); });
    $('#cEmpty').hidden = list.length > 0;
    if (fk) focusFk(fk);
  }

  function addComment(postId, parentId, text) {
    var p = getPost(postId);
    if (!p) return;
    var ts = Date.now();
    var item = {
      id: 'k' + ts.toString(36) + Math.random().toString(36).slice(2, 6),
      text: text, uid: uid, ts: ts, likes: 0, replies: [],
      user: !!user, name: curName(), aid: user ? '' : anonId(uid, ts)
    };
    if (parentId) {
      var f = findC(p, parentId);
      if (!f) return;
      f.item.replies.push(item);
      cs.open.add(parentId);
      cs.replyTo = null;
    } else {
      p.comments.unshift(item);
      cs.sort = 'new';
    }
    savePosts();
    renderComments(parentId ? 'rt:' + parentId : null);
    renderList();
  }

  function startReply(postId, rootId, fromId, mention) {
    cs.replyTo = { cid: rootId, from: fromId, mention: mention };
    cs.open.add(rootId);
    renderComments();
    var ta = $('#rInput');
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }

  function toggleCLike(postId, cid) {
    var p = getPost(postId);
    var f = p && findC(p, cid);
    if (!f) return;
    if (cliked.has(cid)) { cliked.delete(cid); f.item.likes = Math.max(0, f.item.likes - 1); }
    else { cliked.add(cid); f.item.likes += 1; }
    savePosts(); saveCLiked();
    renderComments('cl:' + cid);
  }

  function deleteComment(postId, cid) {
    var p = getPost(postId);
    if (!p) return;
    if (cs.pendDel !== cid) {
      cs.pendDel = cid;
      clearTimeout(cs.pendTimer);
      cs.pendTimer = setTimeout(function () { cs.pendDel = null; if (cs.postId) renderComments(); }, 4000);
      renderComments('cd:' + cid);
      return;
    }
    clearTimeout(cs.pendTimer);
    cs.pendDel = null;
    var f = findC(p, cid);
    if (!f) return;
    if (f.parent) f.parent.replies = f.parent.replies.filter(function (r) { return r.id !== cid; });
    else p.comments = p.comments.filter(function (c) { return c.id !== cid; });
    savePosts();
    renderComments();
    renderList();
    $('#cTitle').focus();
    toast('削除しました');
  }

  $('#cForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = $('#cInput').value.trim();
    if (!t) return;
    addComment(cs.postId, null, t);
    $('#cInput').value = '';
    syncCSubmit();
    $('#cBody').scrollTop = 0;
    toast('コメントしました');
  });
  $('#cInput').addEventListener('input', syncCSubmit);
  Array.prototype.forEach.call(document.querySelectorAll('.csort button'), function (b) {
    b.addEventListener('click', function () { cs.sort = b.getAttribute('data-sort'); renderComments(); });
  });
  $('#cClose').addEventListener('click', function () { closeComments(false); });
  cDlg.addEventListener('click', function (e) { if (e.target === cDlg) closeComments(false); });
  cDlg.addEventListener('close', onCommentsClosed);

  /* ---------- compose form ---------- */
  var form = $('#postForm'), toggleBtn = $('#toggleForm');
  function setForm(open) {
    form.hidden = !open;
    toggleBtn.setAttribute('aria-expanded', String(open));
    toggleBtn.hidden = open;
    if (open) $('#fTitle').focus();
  }
  function setErr(id, inputId, msg) {
    $(id).textContent = msg;
    if (msg) $(inputId).setAttribute('aria-invalid', 'true'); else $(inputId).removeAttribute('aria-invalid');
  }
  function updateCounter() { $('#counter').textContent = $('#fBody').value.length + ' / 2000'; }

  toggleBtn.addEventListener('click', function () { setForm(true); });
  $('#cancelForm').addEventListener('click', function () { setForm(false); });
  $('#fBody').addEventListener('input', updateCounter);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('#fTitle').value.trim();
    var body = $('#fBody').value.trim();
    setErr('#titleErr', '#fTitle', title ? '' : 'タイトルを入力してください。');
    setErr('#bodyErr', '#fBody', body ? '' : '夢の内容を入力してください。');
    if (!title) { $('#fTitle').focus(); return; }
    if (!body) { $('#fBody').focus(); return; }
    var ts = Date.now();
    var post = {
      id: 'p' + ts.toString(36) + Math.random().toString(36).slice(2, 6),
      title: title, body: body, uid: uid, ts: ts, likes: 0, comments: [],
      user: !!user,
      name: user ? user.name : ($('#fName').value.trim() || '名無しさん'),
      aid: user ? '' : anonId(uid, ts)
    };
    posts.unshift(post);
    savePosts();
    $('#fTitle').value = ''; $('#fBody').value = ''; updateCounter();
    setErr('#titleErr', '#fTitle', ''); setErr('#bodyErr', '#fBody', '');
    setForm(false);
    view.mode = 'new';
    render();
    toast('投稿しました');
    $('#listTop').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  });

  /* ---------- controls ---------- */
  $('#modeNew').addEventListener('click', function () { view.mode = 'new'; render(); });
  $('#modeRank').addEventListener('click', function () { view.mode = 'rank'; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('#periods button'), function (b) {
    b.addEventListener('click', function () { view.period = b.getAttribute('data-period'); render(); });
  });

  /* ---------- login (demo: no password) ---------- */
  var dlg = $('#loginDlg');
  function openLogin() {
    $('#lName').value = '';
    setErr('#lErr', '#lName', '');
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    $('#lName').focus();
  }
  function closeLogin() {
    if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
  }
  function logout() {
    user = null;
    store.set('yume_user_v1', null);
    render();
    toast('ログアウトしました');
  }
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('#lName').value.trim();
    if (!name) { setErr('#lErr', '#lName', 'ユーザー名を入力してください。'); $('#lName').focus(); return; }
    user = { name: name };
    store.set('yume_user_v1', user);
    closeLogin();
    render();
    toast(name + ' としてログインしました');
  });
  $('#loginCancel').addEventListener('click', closeLogin);
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeLogin(); });

  /* ---------- reset ---------- */
  $('#resetDemo').addEventListener('click', function () {
    posts = seed(); liked = new Set(); cliked = new Set(); reported = new Set(); expanded = new Set();
    savePosts(); saveLiked(); saveCLiked(); saveReported();
    view.mode = 'new'; view.profile = null; view.prev = null;
    render();
    toast('サンプルデータに戻しました');
  });

  updateCounter();
  render();
})();

</script>
</body>
</html>
